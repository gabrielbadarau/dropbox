<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4bd1" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#ffffff" />

  <!-- Docker Compose boundary -->
  <rect x="40" y="210" width="880" height="410" rx="18" fill="none" stroke="#a4a3f0" stroke-width="2" stroke-dasharray="7 6" />
  <text x="62" y="238" font-size="15" font-weight="600" fill="#5a4bd1">docker compose up -d</text>

  <!-- Browser box -->
  <rect x="330" y="20" width="300" height="86" rx="14" fill="#f2f1fd" stroke="#5a4bd1" stroke-width="2" />
  <text x="480" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Browser</text>
  <text x="480" y="70" text-anchor="middle" font-size="12.5" fill="#4b5563">React + TypeScript + Tailwind v4</text>
  <text x="480" y="88" text-anchor="middle" font-size="12.5" fill="#4b5563">host machine · localhost:5173</text>

  <!-- Dropbox.Api box -->
  <rect x="330" y="260" width="300" height="110" rx="14" fill="#f2f1fd" stroke="#5a4bd1" stroke-width="2" />
  <text x="480" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Dropbox.Api</text>
  <text x="480" y="308" text-anchor="middle" font-size="12.5" fill="#4b5563">ASP.NET Core 10 · Controllers</text>
  <text x="480" y="325" text-anchor="middle" font-size="12.5" fill="#4b5563">JWT auth · REST · SignalR Hub</text>
  <text x="480" y="345" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#5a4bd1">container: api · :5261</text>

  <!-- Postgres box -->
  <rect x="80" y="490" width="270" height="106" rx="14" fill="#eaf1f8" stroke="#336791" stroke-width="2" />
  <text x="215" y="518" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">PostgreSQL 18</text>
  <text x="215" y="538" text-anchor="middle" font-size="12" fill="#4b5563">User · FileMetadata · Chunk</text>
  <text x="215" y="555" text-anchor="middle" font-size="12" fill="#4b5563">SharedFile · ChangeEvent</text>
  <text x="215" y="576" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#336791">container: postgres · :5432</text>

  <!-- MinIO box -->
  <rect x="610" y="490" width="270" height="106" rx="14" fill="#fdecee" stroke="#c72e49" stroke-width="2" />
  <text x="745" y="518" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">MinIO</text>
  <text x="745" y="538" text-anchor="middle" font-size="12" fill="#4b5563">S3-compatible object storage</text>
  <text x="745" y="555" text-anchor="middle" font-size="12" fill="#4b5563">presigned PUT/GET · multipart</text>
  <text x="745" y="576" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#c72e49">container: minio · :9000</text>

  <!-- Browser -> Api -->
  <line x1="480" y1="106" x2="480" y2="258" stroke="#5a4bd1" stroke-width="2.2" marker-end="url(#arrowAccent)" />
  <text x="494" y="180" font-size="12.5" fill="#374151">REST + SignalR</text>
  <text x="494" y="196" font-size="12.5" fill="#374151">Authorization: Bearer &lt;JWT&gt;</text>

  <!-- Api -> Postgres -->
  <line x1="400" y1="370" x2="260" y2="488" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" />
  <text x="255" y="440" font-size="12.5" fill="#374151">EF Core</text>
  <text x="255" y="456" font-size="12.5" fill="#374151">Npgsql</text>

  <!-- Api <-> MinIO (server to server) -->
  <line x1="580" y1="358" x2="700" y2="488" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="425" font-size="12.5" fill="#374151">AWSSDK.S3</text>
  <text x="600" y="441" font-size="12.5" fill="#374151">presign · HeadObject</text>
  <text x="600" y="457" font-size="12.5" fill="#374151">CompleteMultipartUpload</text>

  <!-- MinIO -> Api webhook -->
  <path d="M 790 488 C 760 420, 700 380, 630 358" fill="none" stroke="#c72e49" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="792" y="440" font-size="12.5" fill="#c72e49">webhook:</text>
  <text x="792" y="456" font-size="12.5" fill="#c72e49">upload complete</text>

  <!-- Browser -> MinIO direct (bypasses API for bytes) -->
  <path d="M 630 45 C 850 90, 900 260, 900 400 C 900 440, 860 470, 830 488" fill="none" stroke="#c72e49" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#arrow)" />
  <text x="908" y="220" font-size="12.5" fill="#c72e49" transform="rotate(90 908 220)" text-anchor="middle">direct presigned PUT / GET</text>
  <text x="924" y="220" font-size="12.5" fill="#c72e49" transform="rotate(90 924 220)" text-anchor="middle">file bytes never touch the API</text>

  <!-- Legend -->
  <line x1="60" y1="650" x2="90" y2="650" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" />
  <text x="98" y="654" font-size="12.5" fill="#4b5563">server-to-server call</text>
  <line x1="260" y1="650" x2="290" y2="650" stroke="#c72e49" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#arrow)" />
  <text x="298" y="654" font-size="12.5" fill="#4b5563">direct browser ↔ storage (bypasses the API)</text>
</svg>
