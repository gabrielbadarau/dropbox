services:
  postgres:
    image: postgres:18-alpine
    container_name: dropbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dropbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Webhook notification target - Dropbox.Api runs on the host, not in
      # this compose network, so MinIO reaches it via host.docker.internal.
      MINIO_NOTIFY_WEBHOOK_ENABLE_DROPBOX: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_DROPBOX: "http://host.docker.internal:5261/webhooks/storage"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_DROPBOX: ${STORAGE_WEBHOOK_SECRET}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
