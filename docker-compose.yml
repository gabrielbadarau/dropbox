services:
  postgres:
    image: postgres:18-alpine
    container_name: dropbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dropbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Webhook notification target - api is a service in this same compose
      # network now, reached directly by service name (no more
      # host.docker.internal, which was only needed while Dropbox.Api ran
      # on the host instead of in this network).
      MINIO_NOTIFY_WEBHOOK_ENABLE_DROPBOX: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_DROPBOX: "http://api:8080/webhooks/storage"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_DROPBOX: ${STORAGE_WEBHOOK_SECRET}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Dropbox.Api/Dockerfile
    container_name: dropbox-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Storage__ServiceUrl: "http://minio:9000"
      # Confirmed empirically: presigned URLs built with the internal
      # "minio" hostname get SignatureDoesNotMatch when a host-side client
      # tries to use them - swapping the hostname alone invalidates the
      # SigV4 signature (unlike the scheme). This is the host-reachable
      # address handed out in presigned URLs specifically.
      Storage__PublicServiceUrl: "http://localhost:9000"
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__WebhookSecret: ${STORAGE_WEBHOOK_SECRET}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "5261:8080"

volumes:
  postgres-data:
  minio-data:
